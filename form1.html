<!DOCTYPE html>
<html>
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width,initial-scale=1.0">
      <title>Registration From</title> 
</head>

<body>
    <h2>
        Registration From
    </h2>

    <from action="#" method="post">

        <label for="fullname">Full Name</label><br>
        <input type="text" id="fullname" name="fullname" required><br><br>

        <label for="email">Email</label><br>
        <input type="tel" id="phone" name="phone" required><br><br>

        <lebel>Gender:</lebel><br>

        <input type="radio" id="male" name="Gender" value="Male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="Gender" value="Female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="Gender" value="other">
        <label for="other">Other</label><br><br>

        <label for="dob">Date of Birth</label><br>
        <input type="date" id="dob" name="dob"><br><br>
        
        <label for="password">PAssword:</label><br>
        <input type="password" id="password" name="password"><br><br>

        <label for="confrimPassword">Confrim Password</label><br>
        <input type="confrimPassword" id="confrimPassword" name="confrimPassword" required><br><br>

        <label for="address">Address</label><br>
        <input type="address" id="address" name="address" rows="4"><br><br>


        <label for="department">Department</label><br>
        <select id="department" name="department">
            <option value="CSE">CSE</option>
            <option value="EEE">EEE</option>
            <option value="BBA">BBA</option>
             <option value="English">English</option>
        </select><br><br>
        
        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">I agree to the Terms and Condition</label><br><br>

        <input type="submit" value="Register" ;>

        <input type="reset" value="Reset" ;>
        


    </from>
</body>
</html>
